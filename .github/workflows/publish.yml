name: Publish episodes (render + build + deploy)

# Single owner of the GitHub Pages deploy. When an episode's script.md
# or post.md lands on main (e.g. a draft branch merges) — or when the
# site template / docs change — this workflow runs the whole publish
# end-to-end so that merging the PR is the only manual step:
#
#   1. render any new or changed episode, then upload its episode.mp3 as
#      a GitHub Release asset (tag ep-NNN). Audio is NOT stored in git or
#      served from Pages — build_site.py points the feed/pages at the
#      Release URL. (Installs Piper and downloads the voice model; GitHub
#      runners have open network, so the model download that is blocked
#      in restricted/sandboxed environments works here.);
#   2. rebuild the site into docs/ (small HTML/CSS/RSS only, no audio);
#   3. ensure the episode's "comment on GitHub" labels exist;
#   4. commit episode.json + docs/ back to main FIRST, so a flaky Pages
#      deploy can never lose the render's metadata (a re-run sees the
#      Release asset already present and skips the ~10-minute render);
#   5. deploy docs/ to GitHub Pages.
#
# This is the ONLY workflow that deploys Pages. An earlier pages.yml
# also deployed on docs changes; running two deployers meant a single
# push could trigger both and race to deploy the same commit SHA, which
# GitHub Pages rejects with "Deployment failed, try again later." That
# workflow has been removed in favour of this one.
#
# Commits pushed by the built-in GITHUB_TOKEN do not retrigger
# workflows, so the commit-back in step 4 does not cause a loop.

on:
  push:
    branches: [main]
    paths:
      - "episodes/**/script.md"
      - "episodes/**/post.md"
      - "scripts/generate.py"
      - "scripts/build_site.py"
      - "docs/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Re-render every episode, even if audio already exists"
        type: boolean
        default: false

permissions:
  contents: write   # commit rendered audio + docs/ back to main
  pages: write      # deploy to GitHub Pages
  id-token: write   # OIDC token for deploy-pages
  issues: write     # ensure_labels.py creates comment labels

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history to diff before/after and to push

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install system deps (ffmpeg for the MP3 encode)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Cache Piper voice model
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-voice-${{ hashFiles('scripts/install_voice.sh') }}

      - name: Install voice model
        run: bash scripts/install_voice.sh

      - name: Render new or changed episodes and publish audio to Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_ALL: ${{ github.event.inputs.force_all }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Audio is NOT stored in git — each episode's MP3 lives as a
          # GitHub Release asset (tag ep-NNN, asset episode.mp3). So the
          # "already published?" signal is the Release asset, not a local
          # file. We render an episode when it is forced, its script
          # changed in this push, or its Release asset does not exist yet
          # (e.g. a brand-new episode, or a back catalogue not migrated).
          changed=""
          if [ "${FORCE_ALL:-}" != "true" ] \
             && [ -n "${BEFORE:-}" ] \
             && git rev-parse --quiet --verify "${BEFORE}^{commit}" >/dev/null 2>&1; then
            changed=$(git diff --name-only "$BEFORE" "$AFTER" -- 'episodes/*/script.md' || true)
          fi

          published=0
          for script in episodes/*/script.md; do
            [ -e "$script" ] || continue
            dir=$(dirname "$script")
            slug=$(basename "$dir")
            num="${slug%%-*}"
            tag="ep-$num"

            asset_present=no
            gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null \
              | grep -qx episode.mp3 && asset_present=yes

            need=0
            [ "${FORCE_ALL:-}" = "true" ] && need=1
            [ "$asset_present" = "no" ] && need=1
            printf '%s\n' "$changed" | grep -qxF "$script" && need=1

            if [ "$need" != "1" ]; then
              echo "==> Skipping $slug (release asset present, script unchanged)"
              continue
            fi

            echo "==> Rendering $slug"
            python3 scripts/generate.py "$script"

            title="Episode $num"
            if [ -f "$dir/episode.json" ]; then
              t=$(python3 -c "import json;print(json.load(open('$dir/episode.json')).get('title',''))")
              [ -n "$t" ] && title="Episode $num — $t"
            fi

            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$dir/episode.mp3#episode.mp3" --clobber
            else
              gh release create "$tag" "$dir/episode.mp3#episode.mp3" \
                --title "$title" \
                --notes "Audio enclosure for $slug, hosted as a Release asset."
            fi
            published=$((published + 1))
          done
          echo "Rendered/published $published episode(s) to Releases."

      - name: Build site
        run: python3 scripts/build_site.py

      - name: Ensure episode comment labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          metas=(episodes/*/episode.json)
          if [ ${#metas[@]} -gt 0 ]; then
            python3 scripts/ensure_labels.py "${metas[@]}" \
              || echo "label step failed (non-fatal)"
          else
            echo "No rendered episodes yet."
          fi

      - name: Commit rendered audio and site back to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Audio (episode.mp3), segments/*.wav and episode.wav are
          # gitignored; this stages only episode.json and the regenerated
          # docs/ (HTML/CSS/RSS). No binaries enter git history.
          git add docs episodes
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Publish: render audio + build site [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" || {
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            }
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
