name: Deploy site to GitHub Pages

# Publishes the contents of docs/ to GitHub Pages whenever docs/ changes
# directly on the default branch — e.g. a site-template or styling tweak
# that doesn't touch an episode. The end-to-end episode flow (render →
# build → deploy) is handled by publish.yml, which triggers on episode
# script/post changes and does its own Pages deploy; this workflow covers
# the docs-only case.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
